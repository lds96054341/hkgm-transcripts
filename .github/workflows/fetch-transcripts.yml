name: fetch-hkgm-transcripts

on:
  schedule:
    # UTC 기준. 21:45 UTC = 06:45 KST, 22:40 UTC = 07:40 KST
    # 07:40분 실행은 07:20~07:30에 올라오는 「김현석의 월스트리트나우」를 잡기 위한 것
    - cron: '45 21 * * *'
    - cron: '40 22 * * *'
    # 백필 — 유튜브 자동자막은 업로드 몇 시간~며칠 뒤에 붙는다.
    # 낮/저녁에 다시 훑어 뒤늦게 생긴 자막을 채워 넣는다.
    # (겸사겸사 GitHub 예약 실행이 종종 건너뛰는 문제의 보험 역할도 한다)
    - cron: '10 4 * * *'
    - cron: '20 12 * * *'
  workflow_dispatch:        # 수동 실행 버튼
  push:                     # main에 아무 커밋이나 하면 즉시 실행 (폰에서 트리거하기 쉬움)
    branches: [main]
    paths-ignore:           # 봇이 만든 결과물 커밋으로는 다시 돌지 않음
      - 'transcripts/**'
      - 'status.json'

permissions:
  contents: write

concurrency:
  group: hkgm-transcripts
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Start PO token provider
        run: |
          docker run --name bgutil-provider -d --init -p 4416:4416 \
            brainicism/bgutil-ytdlp-pot-provider || echo "provider 기동 실패(계속 진행)"
          sleep 8
          curl -s -m 5 http://127.0.0.1:4416/ping && echo " provider OK" || echo "provider 응답 없음(계속 진행)"

      - name: Install yt-dlp
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp bgutil-ytdlp-pot-provider
          yt-dlp --version

      - name: Fetch transcripts
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          TRANSCRIPT_KEY: ${{ secrets.TRANSCRIPT_KEY }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess, shutil, glob, time
          from datetime import datetime, timezone, timedelta

          # 핸들(@hkglobalmarket)은 404가 납니다 — 실제 커스텀 URL은 한글(@한경글로벌마켓).
          # 업로드 재생목록(UU...)이 가장 안정적이라 그것부터 시도합니다.
          SOURCES   = [
              "https://www.youtube.com/playlist?list=UUWskYkV4c4S9D__rsfOl2JA",
              "https://www.youtube.com/channel/UCWskYkV4c4S9D__rsfOl2JA/videos",
          ]
          RECENT_N  = 15          # 최근 몇 개까지 확인할지
          KEEP_DAYS = 45          # 오래된 자막 정리 기준
          OUT       = "transcripts"
          TMP       = "_tmp"
          # 자막이 나올 때까지 순서대로 시도할 플레이어 클라이언트
          # ios는 쿠키를 지원하지 않아 제외. 쿠키를 쓰는 클라이언트만 사용.
          CLIENTS   = ["default", "web_safari", "tv", "mweb", "android"]

          KEY = os.environ.get("TRANSCRIPT_KEY", "").strip()
          if not KEY:
              # 암호화 키가 없으면 평문이 공개 저장소에 올라가므로 즉시 중단
              raise SystemExit("[!] TRANSCRIPT_KEY 시크릿이 없습니다. 저장소 Settings > Secrets 에 추가하세요.")

          os.makedirs(OUT, exist_ok=True)
          shutil.rmtree(TMP, ignore_errors=True)
          os.makedirs(TMP, exist_ok=True)

          def encrypt_to(text, dest):
              src = os.path.join(TMP, "_plain.txt")
              with open(src, "w", encoding="utf-8") as f:
                  f.write(text)
              r = subprocess.run(["openssl", "enc", "-aes-256-cbc", "-pbkdf2",
                                  "-iter", "200000", "-salt", "-a",
                                  "-in", src, "-out", dest, "-pass", "env:TRANSCRIPT_KEY"],
                                 capture_output=True, text=True)
              os.remove(src)
              if r.returncode != 0:
                  raise SystemExit("[!] 암호화 실패: " + (r.stderr or "")[-300:])

          base = []
          if os.environ.get("YT_COOKIES", "").strip():
              with open("cookies.txt", "w") as f:
                  f.write(os.environ["YT_COOKIES"])
              base += ["--cookies", "cookies.txt"]
              print("[i] cookies 사용")

          def run(args, timeout=300):
              return subprocess.run(args, capture_output=True, text=True, timeout=timeout)

          # ---------- 1. 최근 업로드 목록 ----------
          ids, list_err, src_used = [], "", None
          for src in SOURCES:
              for client in CLIENTS:
                  r = run(["yt-dlp", "--flat-playlist", "--playlist-end", str(RECENT_N),
                           "--print", "%(id)s", "--extractor-args",
                           f"youtube:player_client={client}", *base, src])
                  got = [l.strip() for l in r.stdout.splitlines() if len(l.strip()) == 11]
                  if got:
                      ids, src_used = got, src
                      print(f"[i] 목록 확보: {len(ids)}개 (src={src}, client={client})")
                      break
                  list_err = f"[{src} / {client}] " + (r.stderr or "")[-600:]
              if ids:
                  break
          if not ids:
              print("[!] 채널 목록을 가져오지 못했습니다")
              print(list_err)

          # ---------- 2. VTT -> 타임스탬프 텍스트 ----------
          TAG = re.compile(r"<[^>]+>")

          def vtt_to_text(path, bucket=30):
              """자동자막 VTT를 30초 단위 [HH:MM:SS] 블록 텍스트로 변환"""
              cues, cur_t = [], None
              for raw in open(path, encoding="utf-8", errors="ignore"):
                  line = raw.rstrip("\n")
                  m = re.match(r"(\d{2}):(\d{2}):(\d{2})\.\d{3}\s+-->", line)
                  if m:
                      h, mi, s = int(m.group(1)), int(m.group(2)), int(m.group(3))
                      cur_t = h * 3600 + mi * 60 + s
                      continue
                  if not line.strip() or line.startswith(("WEBVTT", "Kind:", "Language:", "NOTE")):
                      continue
                  if cur_t is None:
                      continue
                  txt = TAG.sub("", line).strip()
                  if txt:
                      cues.append((cur_t, txt))

              # 롤링 자막 중복 제거
              seen_last, dedup = None, []
              for t, txt in cues:
                  if txt == seen_last:
                      continue
                  seen_last = txt
                  dedup.append((t, txt))

              # 30초 버킷으로 묶기
              blocks, cur_key, buf = [], None, []
              for t, txt in dedup:
                  key = (t // bucket) * bucket
                  if cur_key is None:
                      cur_key = key
                  if key != cur_key:
                      if buf:
                          blocks.append((cur_key, " ".join(buf)))
                      cur_key, buf = key, []
                  buf.append(txt)
              if buf:
                  blocks.append((cur_key, " ".join(buf)))

              out = []
              for t, txt in blocks:
                  hh, rem = divmod(t, 3600)
                  mm, ss = divmod(rem, 60)
                  # 버킷 안에서도 반복 어절 정리
                  words, prev = [], None
                  for w in txt.split():
                      if w != prev:
                          words.append(w)
                      prev = w
                  out.append(f"[{hh:02d}:{mm:02d}:{ss:02d}] " + " ".join(words))
              return "\n".join(out)

          # ---------- 3. 영상별 처리 ----------
          status = {
              "last_run_utc": datetime.now(timezone.utc).isoformat(timespec="seconds"),
              "source_used": src_used, "listed": len(ids), "results": [],
              "list_error": list_err[:500],
          }
          index = {}
          if os.path.exists(os.path.join(OUT, "index.json")):
              try:
                  index = json.load(open(os.path.join(OUT, "index.json"), encoding="utf-8"))
              except Exception:
                  index = {}

          for vid in ids:
              target = os.path.join(OUT, f"{vid}.enc")
              if os.path.exists(target) and index.get(vid, {}).get("ok"):
                  status["results"].append({"id": vid, "state": "cached"})
                  continue

              url = f"https://www.youtube.com/watch?v={vid}"
              got_sub, used_client, info, last_err = None, None, None, ""

              for client in CLIENTS:
                  shutil.rmtree(TMP, ignore_errors=True)
                  os.makedirs(TMP, exist_ok=True)
                  r = run(["yt-dlp", "--skip-download",
                           # 자막만 받으므로 재생 포맷이 없어도 오류로 처리하지 않음
                           "--ignore-no-formats-error", "--no-abort-on-error",
                           "--write-auto-subs", "--write-subs",
                           "--sub-langs", "ko.*,ko,en.*",
                           "--sub-format", "vtt/best",
                           "--write-info-json",
                           "--retries", "3", "--socket-timeout", "30",
                           "--extractor-args", f"youtube:player_client={client}",
                           "-o", os.path.join(TMP, "%(id)s"), *base, url], timeout=420)
                  vtts = sorted(glob.glob(os.path.join(TMP, "*.vtt")))
                  # 한국어 우선
                  ko = [p for p in vtts if re.search(r"\.ko", os.path.basename(p))]
                  pick = (ko or vtts)
                  ij = glob.glob(os.path.join(TMP, "*.info.json"))
                  if ij:
                      try:
                          info = json.load(open(ij[0], encoding="utf-8"))
                      except Exception:
                          info = None
                  if pick:
                      got_sub, used_client = pick[0], client
                      break
                  last_err = f"[{client}] " + (r.stderr or r.stdout or "(출력 없음)")[-400:]
                  time.sleep(2)

              if not got_sub:
                  status["results"].append({"id": vid, "state": "no_subtitle",
                                            "error": last_err})
                  index[vid] = {"ok": False, "title": (info or {}).get("title", "")}
                  continue

              body = vtt_to_text(got_sub)
              title = (info or {}).get("title", "")
              ts    = (info or {}).get("timestamp") or 0
              dur   = (info or {}).get("duration") or 0
              lang  = re.search(r"\.([A-Za-z\-]+)\.vtt$", os.path.basename(got_sub))
              lang  = lang.group(1) if lang else "?"
              kst   = datetime.fromtimestamp(ts, timezone(timedelta(hours=9))).strftime("%Y-%m-%d %H:%M KST") if ts else "?"

              header = (f"# videoId: {vid}\n# title: {title}\n# uploaded_kst: {kst}\n"
                        f"# uploaded_epoch: {ts}\n# duration_sec: {dur}\n"
                        f"# sub_lang: {lang}\n# client: {used_client}\n"
                        f"# note: 30초 단위 블록, [HH:MM:SS]는 영상 내 위치\n\n")
              encrypt_to(header + body + "\n", target)

              index[vid] = {"ok": True, "title": title, "uploaded_epoch": ts,
                            "duration_sec": dur, "lang": lang, "chars": len(body)}
              status["results"].append({"id": vid, "state": "fetched",
                                        "lang": lang, "client": used_client, "chars": len(body)})
              print(f"[+] {vid} {lang} {len(body)}자 (client={used_client})")

          # ---------- 4. 오래된 파일 정리 ----------
          cutoff = time.time() - KEEP_DAYS * 86400
          for p in glob.glob(os.path.join(OUT, "*.enc")):
              vid = os.path.splitext(os.path.basename(p))[0]
              ep = index.get(vid, {}).get("uploaded_epoch") or 0
              if ep and ep < cutoff:
                  os.remove(p)
                  index.pop(vid, None)

          json.dump(index, open(os.path.join(OUT, "index.json"), "w", encoding="utf-8"),
                    ensure_ascii=False, indent=1, sort_keys=True)
          json.dump(status, open("status.json", "w", encoding="utf-8"),
                    ensure_ascii=False, indent=1)
          shutil.rmtree(TMP, ignore_errors=True)
          if os.path.exists("cookies.txt"):
              os.remove("cookies.txt")
          print(json.dumps(status, ensure_ascii=False, indent=1)[:2000])
          PY

      - name: Commit
        run: |
          # 안전장치: 평문 자막이 남아 있으면 커밋하지 않고 중단
          if ls transcripts/*.txt >/dev/null 2>&1; then
            echo "평문 자막 파일이 발견되어 커밋을 중단합니다"; exit 1
          fi
          git config user.name  "hkgm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A transcripts status.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "transcripts: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
         

