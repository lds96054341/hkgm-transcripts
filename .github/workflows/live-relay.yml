name: live-relay

# ─────────────────────────────────────────────────────────────────────
# ★23 2026-10-02 추가. 월나우 라이브 녹음(record-live.yml)을 예약 실행 대신 '릴레이'로 깨운다.
#   GitHub 예약 실행은 몇 시간씩 늦거나 아예 뜨지 않는다. 10/2에는 record-live 예약 5개 중
#   4개가 실행조차 만들어지지 않았고 1개는 방송이 끝난 07:54 KST 에 떠서 방송을 놓쳤다.
#   수집기 예약도 하루 6개 중 1~2개만 3~6시간 늦게 떴다.
#
#   그래서 이 워크플로는 자기 자신을 이어서 실행한다(GITHUB_TOKEN 으로 보낸 workflow_dispatch 는
#   예외적으로 새 실행을 만든다). 한 번 돌 때:
#     1) 지금이 KST 화~토 06:00~06:59 이고 오늘 03:00 KST 이후 record-live 실행(새벽 예약 포함)이 없으면 record-live 를 실행한다
#        (wait_0625=true — record-live 가 06:25 KST 까지 자고 나서 라이브를 찾는다).
#     2) 다음 목표(다음 KST 화~토 06:05)까지 자되, 러너 상한(360분) 때문에 최대 330분만 잔다.
#     3) 깨어나면 자기 자신을 다시 실행한다. 다음 실행이 1)부터 반복한다.
#   목표 시각에 깨어난 실행이 다음 실행을 띄우면, 그 실행이 06:05 직후에 1)을 수행한다.
#
#   사슬이 끊겨도 다시 이어지게 이 워크플로를 실행하는 곳이 셋이다.
#     - 수집기(fetch-transcripts.yml) 마지막 단계 — 실행마다(예약·수동 모두) 릴레이를 다시 건다
#     - 아래 예약 실행 — 늦거나 빠져도 언젠가 하나는 뜨면 된다
#     - 사람이 Actions 탭에서 수동 실행
#   concurrency 의 cancel-in-progress: true 로 새 실행이 자고 있던 앞 실행을 취소하므로 사슬은 늘 하나다.
#   공개 저장소라 대기 시간도 Actions 사용량 과금이 없다.
# ─────────────────────────────────────────────────────────────────────

on:
  schedule:
    # 사슬 재시작용 보험. 정시·30분을 피한 분으로 건다.
    - cron: '13 3 * * *'
    - cron: '43 9 * * *'
    - cron: '17 15 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'true 면 계산만 출력하고 record-live·다음 릴레이를 실행하지 않는다(점검용)'
        required: false
        default: 'false'

permissions:
  actions: write
  contents: read

concurrency:
  group: hkgm-live-relay
  cancel-in-progress: true

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
    steps:
      - name: Plan
        id: plan
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt, json, os, subprocess, sys
          KST = dt.timezone(dt.timedelta(hours=9))
          now = dt.datetime.now(KST)
          TARGET_H, TARGET_M = 6, 5          # 다음 목표 시각(KST)
          MAX_SLEEP = 330 * 60               # 러너 상한 360분 안쪽
          air_day = lambda d: d.weekday() in (1, 2, 3, 4, 5)   # 화~토 (월=0)

          # 1) 녹음 창 안이면 record-live 를 실행할지 판단
          dispatch = False
          if air_day(now) and now.hour == 6:
              since = now.replace(hour=3, minute=0, second=0, microsecond=0)
              out = subprocess.run(
                  ["gh", "run", "list", "-w", "record-live.yml", "-L", "10", "--json", "createdAt"],
                  capture_output=True, text=True)
              if out.returncode != 0:
                  print(f"[!] gh run list 실패 — 그래도 실행한다: {out.stderr.strip()}", file=sys.stderr)
                  dispatch = True
              else:
                  runs = json.loads(out.stdout or "[]")
                  recent = [r for r in runs
                            if dt.datetime.fromisoformat(r["createdAt"].replace("Z", "+00:00")) >= since]
                  dispatch = not recent
                  print(f"[i] 오늘 03:00 KST 이후 record-live 실행 {len(recent)}건", file=sys.stderr)

          # 2) 다음 목표 시각
          t = now.replace(hour=TARGET_H, minute=TARGET_M, second=0, microsecond=0)
          while t <= now or not air_day(t):
              t += dt.timedelta(days=1)
          sleep = int(min((t - now).total_seconds(), MAX_SLEEP))
          print(f"[i] 지금 {now:%Y-%m-%d %a %H:%M} KST · record-live 실행={dispatch} · "
                f"다음 목표 {t:%m-%d %a %H:%M} KST · {sleep // 60}분 대기", file=sys.stderr)
          print(f"dispatch={'true' if dispatch else 'false'}")
          print(f"sleep={sleep}")
          print(f"target={t:%m-%d %H:%M}")
          PY
          cat "$GITHUB_OUTPUT"

      - name: Dispatch record-live
        if: steps.plan.outputs.dispatch == 'true' && env.DRY_RUN != 'true'
        run: |
          gh workflow run record-live.yml --ref main -f wait_0625=true
          echo "### record-live 실행 요청 $(TZ=Asia/Seoul date '+%m-%d %H:%M') KST" >> "$GITHUB_STEP_SUMMARY"

      - name: Sleep until next hop
        if: env.DRY_RUN != 'true'
        run: |
          echo "### 다음 목표 ${{ steps.plan.outputs.target }} KST — $(( ${{ steps.plan.outputs.sleep }} / 60 ))분 대기" >> "$GITHUB_STEP_SUMMARY"
          sleep ${{ steps.plan.outputs.sleep }}

      - name: Dispatch next relay
        if: env.DRY_RUN != 'true'
        run: |
          # 다음 실행이 이 실행을 취소하는데, 이 단계가 마지막이라 상관없다.
          for i in 1 2 3 4 5; do
            gh workflow run live-relay.yml --ref main && exit 0
            echo "재시도 ${i}"; sleep $((i * 20))
          done
          echo "::error::다음 릴레이를 실행하지 못했습니다 — 수집기·예약 실행이 다시 걸 때까지 사슬이 끊깁니다."
          exit 1
